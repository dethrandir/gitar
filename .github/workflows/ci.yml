name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          set -eu
          shellcheck install.sh uninstall.sh gitar run.sh scripts/install-v2.sh
          if compgen -G "scripts/*.sh" > /dev/null; then
            shellcheck scripts/*.sh
          fi

  powershell:
    name: PowerShell scripts (parse)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $f = "scripts/install.ps1"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Parse uninstall.ps1
        shell: pwsh
        run: |
          $f = "scripts/uninstall.ps1"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Parse run.ps1
        shell: pwsh
        run: |
          $f = "scripts/run.ps1"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: Test
        run: pytest

  engine:
    name: Engine (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect engine
        id: detect
        run: |
          if [ -f engine/CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build tools
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format \
            libasound2-dev libpulse-dev libjack-jackd2-dev
      - name: Configure
        if: steps.detect.outputs.present == 'true'
        run: cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cmake --build engine/build
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: ctest --test-dir engine/build --output-on-failure
      - name: Format check
        if: steps.detect.outputs.present == 'true'
        run: |
          git ls-files engine | grep -E '\.(cpp|hpp|cc|h)$' | grep -v '^engine/third_party/' \
            | xargs -r clang-format --dry-run --Werror

  engine-windows:
    name: Engine (Windows build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build engine/build --config Release
      - name: Test
        run: ctest --test-dir engine/build -C Release --output-on-failure
