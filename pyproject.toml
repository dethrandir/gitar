[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitar"
dynamic = ["version"]
description = "Cross-platform guitar routing control server"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
gitard = "gitar_server.cli:main"

[tool.hatch.version]
path = "src/gitar_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gitar_server"]

[tool.hatch.build.targets.sdist]
include = ["src/gitar_server"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.10"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
