<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>gitar</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>gitar</h1>
        <span class="version" id="version">&mdash;</span>
      </div>
      <div class="pill" id="pill" data-state="offline" role="status" aria-live="polite">
        <span class="pill-dot" aria-hidden="true"></span>
        <span id="pill-text">connecting&hellip;</span>
      </div>
    </header>

    <main class="layout">
      <p class="flash" id="flash" role="alert" hidden></p>

      <section class="card" aria-labelledby="setup-title">
        <h2 id="setup-title">Setup</h2>
        <div class="fields">
          <div class="field">
            <label for="source">Input device</label>
            <select id="source"></select>
          </div>
          <div class="field">
            <label for="channel">Channel</label>
            <select id="channel"></select>
          </div>
          <div class="field">
            <label for="output">Output device</label>
            <select id="output"></select>
          </div>
          <div class="field">
            <label for="latency">Latency (frames/rate)</label>
            <input id="latency" type="text" inputmode="numeric" value="128/48000" spellcheck="false" />
          </div>
        </div>
        <div class="actions">
          <button type="button" id="save-config">Save</button>
        </div>
      </section>

      <section class="card" aria-labelledby="rig-title">
        <h2 id="rig-title">Rig</h2>
        <div class="actions">
          <button type="button" id="connect-direct">Direct</button>
          <button type="button" id="connect-amp">Amp</button>
          <button type="button" id="disconnect" class="ghost">Disconnect</button>
        </div>

        <div class="field">
          <label for="volume">Volume <output id="volume-value" for="volume">100%</output></label>
          <input id="volume" type="range" min="0" max="150" step="1" value="100" />
        </div>

        <div class="field">
          <label for="tone">Tone</label>
          <div class="row">
            <select id="tone"></select>
            <button type="button" id="load-tone">Load tone</button>
          </div>
        </div>

        <div class="field">
          <label for="meter-seconds">Level meter</label>
          <div class="row">
            <input id="meter-seconds" type="number" min="1" max="60" step="1" value="10" />
            <button type="button" id="measure">Measure</button>
          </div>
          <p class="meter-result" id="meter-result" hidden>
            <span class="meter-peak" id="meter-peak"></span>
            <span class="meter-advice" id="meter-advice"></span>
          </p>
        </div>
      </section>

      <section class="card" aria-labelledby="engine-title">
        <h2 id="engine-title">Engine</h2>
        <p class="hint" id="engine-hint" hidden>
          gitar-engine binary not found &mdash; engine controls are disabled.
        </p>

        <div class="fields">
          <div class="field">
            <label for="engine-input">Input device</label>
            <select id="engine-input"></select>
          </div>
          <div class="field">
            <label for="engine-output">Output device</label>
            <select id="engine-output"></select>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="engine-start">Start</button>
          <button type="button" id="engine-stop" class="ghost">Stop</button>
        </div>

        <div class="field">
          <label for="engine-model">Model</label>
          <div class="row">
            <select id="engine-model"></select>
            <button type="button" id="engine-load-model">Load model</button>
            <button type="button" id="engine-clear-model" class="ghost">Clear</button>
          </div>
        </div>

        <div class="field">
          <label for="engine-gain">
            Gain <output id="engine-gain-value" for="engine-gain">1.00&times;</output>
          </label>
          <input id="engine-gain" type="range" min="0" max="4" step="0.05" value="1" />
        </div>

        <div class="field">
          <label class="checkbox" for="engine-gate-enabled">
            <input id="engine-gate-enabled" type="checkbox" />
            Noise gate
          </label>
        </div>

        <div class="field">
          <label for="engine-gate-threshold">
            Gate threshold
            <output id="engine-gate-value" for="engine-gate-threshold">-60 dB</output>
          </label>
          <input
            id="engine-gate-threshold"
            type="range"
            min="-96"
            max="0"
            step="1"
            value="-60"
          />
        </div>

        <div class="field">
          <label>EQ</label>
          <div class="eq-controls">
            <div class="eq-control">
              <label for="engine-eq-low">
                Low <output id="engine-eq-low-value" for="engine-eq-low">0.0 dB</output>
              </label>
              <input id="engine-eq-low" type="range" min="-24" max="24" step="0.5" value="0" />
            </div>
            <div class="eq-control">
              <label for="engine-eq-mid">
                Mid <output id="engine-eq-mid-value" for="engine-eq-mid">0.0 dB</output>
              </label>
              <input id="engine-eq-mid" type="range" min="-24" max="24" step="0.5" value="0" />
            </div>
            <div class="eq-control">
              <label for="engine-eq-high">
                High <output id="engine-eq-high-value" for="engine-eq-high">0.0 dB</output>
              </label>
              <input id="engine-eq-high" type="range" min="-24" max="24" step="0.5" value="0" />
            </div>
          </div>
        </div>

        <div class="field">
          <label for="engine-cab">Cabinet</label>
          <div class="row">
            <select id="engine-cab"></select>
            <button type="button" id="engine-load-cab">Load</button>
            <button type="button" id="engine-clear-cab" class="ghost">Clear</button>
          </div>
        </div>

        <div class="field">
          <label for="engine-preset">Preset</label>
          <div class="row">
            <select id="engine-preset"></select>
            <button type="button" id="engine-load-preset">Load</button>
            <button type="button" id="engine-save-preset">Save</button>
            <button type="button" id="engine-delete-preset" class="ghost">Delete</button>
          </div>
        </div>

        <div class="levels">
          <div class="level-row">
            <span class="level-label">In</span>
            <div class="level-bar">
              <div class="level-fill" id="engine-input-bar"></div>
            </div>
            <span class="level-value" id="engine-input-peak">&mdash;</span>
          </div>
          <div class="level-row">
            <span class="level-label">Out</span>
            <div class="level-bar">
              <div class="level-fill" id="engine-output-bar"></div>
            </div>
            <span class="level-value" id="engine-output-peak">&mdash;</span>
          </div>
        </div>

        <div class="tuner" id="engine-tuner" data-state="idle">
          <div class="tuner-head">
            <span class="tuner-label">Tuner</span>
            <span class="tuner-note" id="tuner-note">&mdash;</span>
            <span class="tuner-cents" id="tuner-cents"></span>
          </div>
          <div class="tuner-scale">
            <div class="tuner-center" aria-hidden="true"></div>
            <div class="tuner-needle" id="tuner-needle"></div>
          </div>
        </div>

        <div class="spectrum" id="engine-spectrum" data-state="idle">
          <span class="spectrum-label">Spectrum</span>
          <div class="spectrum-bars" id="engine-spectrum-bars"></div>
        </div>

        <dl class="details" id="engine-details"></dl>
      </section>

      <section class="card" aria-labelledby="status-title">
        <h2 id="status-title">Status</h2>
        <dl class="details" id="details"></dl>
      </section>
    </main>
  </body>
</html>
